<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Tienda</title>
<style>
  :root{
    --negro:#111111;
    --rojo:#d90429;
    --rojo-oscuro:#a30320;
    --blanco:#ffffff;
    --gris-claro:#f7f7f7;
    --gris-borde:#e2e2e2;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:var(--blanco);
    color:var(--negro);
  }
  header{
    background:var(--negro);
    color:var(--blanco);
    padding:20px 24px;
    text-align:center;
  }
  header h1{
    margin:0 0 4px;
    font-size:26px;
    letter-spacing:1px;
  }
  header p{
    margin:0;
    color:#ccc;
    font-size:14px;
  }

  #filtros{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
    padding:18px 16px;
    background:var(--gris-claro);
    border-bottom:1px solid var(--gris-borde);
  }
  #filtros button{
    border:2px solid var(--negro);
    background:var(--blanco);
    color:var(--negro);
    padding:7px 16px;
    border-radius:20px;
    cursor:pointer;
    font-size:13px;
    font-weight:bold;
  }
  #filtros button.activo{
    background:var(--rojo);
    border-color:var(--rojo);
    color:var(--blanco);
  }

  #contenedorProductos{
    max-width:1200px;
    margin:0 auto;
    padding:28px 20px 80px;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(230px,1fr));
    gap:22px;
  }

  .tarjeta{
    border:1px solid var(--gris-borde);
    border-radius:10px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    transition:box-shadow 0.15s ease;
  }
  .tarjeta:hover{ box-shadow:0 4px 16px rgba(0,0,0,0.12); }
  .tarjeta img{
    width:100%;
    height:190px;
    object-fit:cover;
    background:var(--gris-claro);
    display:block;
  }
  .contenedor-imagen{ position:relative; }
  .flecha-foto{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    background:rgba(0,0,0,0.5);
    color:var(--blanco);
    border:none;
    width:28px;
    height:28px;
    border-radius:50%;
    cursor:pointer;
    font-size:16px;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .flecha-foto:hover{ background:rgba(0,0,0,0.75); }
  .flecha-izq{ left:8px; }
  .flecha-der{ right:8px; }
  .contador-fotos{
    position:absolute;
    bottom:8px;
    right:8px;
    background:rgba(0,0,0,0.6);
    color:var(--blanco);
    font-size:11px;
    padding:2px 8px;
    border-radius:10px;
  }
  .tarjeta .info{
    padding:14px;
    flex:1;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .tarjeta .categoria{
    align-self:flex-start;
    background:var(--negro);
    color:var(--blanco);
    font-size:11px;
    padding:3px 10px;
    border-radius:10px;
    text-transform:uppercase;
    letter-spacing:0.5px;
  }
  .tarjeta .nombre{ font-weight:bold; font-size:16px; }
  .tarjeta .descripcion{ font-size:13px; color:#555; flex:1; }
  .tarjeta .precio{ color:var(--rojo); font-weight:bold; font-size:18px; }

  .tarjeta .controles-cantidad{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:4px;
  }
  .tarjeta .controles-cantidad button{
    width:28px; height:28px;
    border:1px solid var(--gris-borde);
    background:var(--blanco);
    border-radius:6px;
    cursor:pointer;
    font-size:15px;
  }
  .tarjeta .controles-cantidad span{ min-width:20px; text-align:center; font-weight:bold; }

  .tarjeta .acciones{
    display:flex;
    flex-direction:column;
    gap:8px;
    padding:0 14px 14px;
  }
  .btn{
    border:none;
    padding:10px;
    border-radius:6px;
    cursor:pointer;
    font-size:13px;
    font-weight:bold;
    text-align:center;
    text-decoration:none;
  }
  .btn-agregar{ background:var(--rojo); color:var(--blanco); }
  .btn-agregar:hover{ background:var(--rojo-oscuro); }
  .btn-preguntar{
    background:var(--blanco);
    color:var(--negro);
    border:1px solid var(--negro);
  }
  .btn-preguntar:hover{ background:var(--gris-claro); }

  #mensajeVacio{
    grid-column:1/-1;
    text-align:center;
    color:#777;
    padding:60px 20px;
  }

  /* Carrito flotante */
  #botonCarrito{
    position:fixed;
    bottom:24px;
    right:24px;
    background:var(--rojo);
    color:var(--blanco);
    width:60px;
    height:60px;
    border-radius:50%;
    border:none;
    font-size:24px;
    cursor:pointer;
    box-shadow:0 3px 10px rgba(0,0,0,0.3);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #contadorCarrito{
    position:fixed;
    bottom:66px;
    right:20px;
    background:var(--negro);
    color:var(--blanco);
    font-size:11px;
    font-weight:bold;
    min-width:20px;
    height:20px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 5px;
  }

  #botonChat{
    position:fixed;
    bottom:24px;
    left:24px;
    background:var(--negro);
    color:var(--blanco);
    width:56px;
    height:56px;
    border-radius:50%;
    border:none;
    font-size:24px;
    cursor:pointer;
    box-shadow:0 3px 10px rgba(0,0,0,0.3);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:12;
  }

  #fondoOscuro, #fondoOscuroChat{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.5);
    z-index:10;
  }
  #panelCarrito{
    display:none;
    position:fixed;
    top:0; right:0;
    width:100%;
    max-width:380px;
    height:100%;
    background:var(--blanco);
    z-index:11;
    box-shadow:-4px 0 16px rgba(0,0,0,0.2);
    flex-direction:column;
  }
  #panelCarrito .cabecera-carrito{
    background:var(--negro);
    color:var(--blanco);
    padding:16px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  #panelCarrito .cabecera-carrito button{
    background:none;
    border:none;
    color:var(--blanco);
    font-size:20px;
    cursor:pointer;
  }
  #itemsCarrito{
    flex:1;
    overflow-y:auto;
    padding:12px 20px;
  }
  .item-carrito{
    display:flex;
    gap:10px;
    padding:10px 0;
    border-bottom:1px solid var(--gris-borde);
    align-items:center;
  }
  .item-carrito img{
    width:54px; height:54px;
    object-fit:cover;
    border-radius:6px;
  }
  .item-carrito .detalle{ flex:1; }
  .item-carrito .detalle .nombre{ font-weight:bold; font-size:13px; }
  .item-carrito .detalle .precio{ color:var(--rojo); font-size:13px; }
  .item-carrito .cantidad-controles{
    display:flex;
    align-items:center;
    gap:6px;
  }
  .item-carrito .cantidad-controles button{
    width:24px; height:24px;
    border:1px solid var(--gris-borde);
    background:var(--blanco);
    border-radius:5px;
    cursor:pointer;
  }
  .item-carrito .quitar{
    background:none;
    border:none;
    color:var(--rojo);
    cursor:pointer;
    font-size:12px;
    text-decoration:underline;
    margin-left:8px;
  }
  #resumenCarrito{
    padding:16px 20px;
    border-top:2px solid var(--negro);
  }
  #resumenCarrito .total{
    display:flex;
    justify-content:space-between;
    font-size:17px;
    font-weight:bold;
    margin-bottom:12px;
  }
  #resumenCarrito .total span:last-child{ color:var(--rojo); }
  #botonFinalizar{
    width:100%;
    background:var(--rojo);
    color:var(--blanco);
    padding:13px;
    border:none;
    border-radius:6px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
  }
  #botonFinalizar:hover{ background:var(--rojo-oscuro); }
  #carritoVacioTexto{ color:#777; text-align:center; padding:30px 0; }

  /* Chat interno */
  #panelChat{
    display:none;
    position:fixed;
    top:0; right:0;
    width:100%;
    max-width:380px;
    height:100%;
    background:var(--blanco);
    z-index:11;
    box-shadow:-4px 0 16px rgba(0,0,0,0.2);
    flex-direction:column;
  }
  #panelChat .cabecera-carrito{
    background:var(--negro);
    color:var(--blanco);
    padding:16px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  #panelChat .cabecera-carrito button{
    background:none;
    border:none;
    color:var(--blanco);
    font-size:20px;
    cursor:pointer;
  }
  .campo-chat{ margin-bottom:10px; }
  .campo-chat input{
    width:100%;
    padding:9px;
    border:1px solid var(--gris-borde);
    border-radius:6px;
    font-size:14px;
    font-family:inherit;
  }
  #conversacionChat{
    flex:1;
    display:none;
    flex-direction:column;
    min-height:0;
  }
  #estadoChatCliente{
    font-size:12px;
    color:#777;
    padding:10px 20px 0;
    margin:0;
  }
  .mensajes-chat{
    flex:1;
    overflow-y:auto;
    padding:12px 20px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .burbuja{
    max-width:82%;
    padding:8px 12px;
    border-radius:10px;
    font-size:13px;
    line-height:1.4;
    word-wrap:break-word;
    white-space:pre-line;
  }
  .burbuja.cliente{
    align-self:flex-end;
    background:var(--rojo);
    color:var(--blanco);
  }
  .burbuja.admin{
    align-self:flex-start;
    background:var(--gris-claro);
    border:1px solid var(--gris-borde);
  }
  .burbuja .autor{
    display:block;
    font-size:10px;
    opacity:0.75;
    margin-bottom:2px;
  }
  #formEnviarMensajeChat{
    display:flex;
    gap:8px;
    padding:12px 20px;
    border-top:1px solid var(--gris-borde);
  }
  #formEnviarMensajeChat input{
    flex:1;
    padding:9px;
    border:1px solid var(--gris-borde);
    border-radius:6px;
    font-size:14px;
    font-family:inherit;
  }
  #btnNuevaConversacion{
    margin:0 20px 14px;
    font-size:11px;
    background:none;
    border:none;
    text-decoration:underline;
    cursor:pointer;
    color:#999;
    align-self:flex-start;
  }
</style>
</head>
<body>

<header>
  <h1 id="tituloTienda">Mi Tienda</h1>
  <p>Selecciona tus productos y arma tu pedido</p>
</header>

<div id="filtros"></div>

<div id="contenedorProductos">
  <p id="mensajeVacio" style="display:none;">Aún no hay productos disponibles. Vuelve pronto.</p>
</div>

<button id="botonCarrito" title="Ver carrito">🛒</button>
<span id="contadorCarrito">0</span>

<button id="botonChat" title="Chatea con nosotros">💬</button>

<div id="fondoOscuro"></div>
<div id="panelCarrito">
  <div class="cabecera-carrito">
    <strong>Tu pedido</strong>
    <button id="btnCerrarCarrito">✕</button>
  </div>
  <div id="itemsCarrito"></div>
  <div id="resumenCarrito">
    <div class="total"><span>Total</span><span id="totalCarrito">$0.00</span></div>
    <button id="botonFinalizar">Finalizar pedido por chat</button>
  </div>
</div>

<div id="fondoOscuroChat"></div>
<div id="panelChat">
  <div class="cabecera-carrito">
    <strong>Chat con la tienda</strong>
    <button id="btnCerrarChat">✕</button>
  </div>

  <div id="formInicioChat" style="padding:18px 20px;">
    <p style="font-size:13px; color:#555; margin-top:0;">Para comenzar, cuéntanos quién eres. Un asesor te va a atender por aquí mismo.</p>
    <div class="campo-chat">
      <input type="text" id="campoNombreChatCliente" placeholder="Tu nombre" required>
    </div>
    <div class="campo-chat">
      <input type="tel" id="campoTelefonoChatCliente" placeholder="Tu teléfono" required>
    </div>
    <button type="button" class="btn btn-agregar" id="btnIniciarChat" style="width:100%;">Iniciar chat</button>
  </div>

  <div id="conversacionChat">
    <p id="estadoChatCliente"></p>
    <div id="mensajesChatCliente" class="mensajes-chat"></div>
    <form id="formEnviarMensajeChat">
      <input type="text" id="campoMensajeChat" placeholder="Escribe tu mensaje..." required>
      <button type="submit" class="btn btn-agregar">Enviar</button>
    </form>
    <button type="button" id="btnNuevaConversacion">Iniciar una nueva conversación</button>
  </div>
</div>

<!-- ======================================================= -->
<!-- FIREBASE -->
<!-- ======================================================= -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// =========================================================
// 1) CONFIGURACIÓN — PEGA AQUÍ TUS DATOS
//    (misma configuración de Firebase que en admin.html)
// =========================================================
const firebaseConfig = {
  apiKey: "AIzaSyCjMj_9H_-omHVV6wyvYxg3txHxOILfU2Q",
  authDomain: "afim-store-1bd2c.firebaseapp.com",
  projectId: "afim-store-1bd2c",
  storageBucket: "afim-store-1bd2c.firebasestorage.app",
  messagingSenderId: "848659458259",
  appId: "1:848659458259:web:30d2efc9f917f5cbd3cc26"
};

// =========================================================
// 2) CONFIGURACIÓN DE LA TIENDA — EDITA ESTE DATO
// =========================================================
const CONFIG_TIENDA = {
  nombreTienda: "Mi Tienda"
};

document.getElementById('tituloTienda').textContent = CONFIG_TIENDA.nombreTienda;

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// =========================================================
// 3) ESTADO EN MEMORIA
// =========================================================
let productos = [];        // todos los productos leídos de Firestore
let categoriaActiva = 'Todos';
let carrito = cargarCarrito();

function cargarCarrito(){
  try{
    return JSON.parse(localStorage.getItem('carritoTienda')) || [];
  }catch(e){
    return [];
  }
}
function guardarCarrito(){
  localStorage.setItem('carritoTienda', JSON.stringify(carrito));
}

// =========================================================
// 4) LEER PRODUCTOS EN TIEMPO REAL
// =========================================================
db.collection('productos').orderBy('creado', 'desc').onSnapshot(function(snapshot){
  productos = [];
  snapshot.forEach(function(doc){
    productos.push(Object.assign({ id: doc.id }, doc.data()));
  });
  renderizarFiltros();
  renderizarProductos();
}, function(error){
  console.error('Error leyendo productos:', error);
});

function formatearPrecio(numero){
  return Number(numero || 0).toLocaleString('es-MX', { style:'currency', currency:'MXN' });
}
function escaparHtml(texto){
  const div = document.createElement('div');
  div.textContent = texto || '';
  return div.innerHTML;
}

// =========================================================
// 5) FILTROS POR CATEGORÍA
// =========================================================
const contenedorFiltros = document.getElementById('filtros');

function renderizarFiltros(){
  const categorias = ['Todos'].concat(
    Array.from(new Set(productos.map(function(p){ return p.categoria; }).filter(Boolean)))
  );
  contenedorFiltros.innerHTML = '';
  categorias.forEach(function(cat){
    const boton = document.createElement('button');
    boton.textContent = cat;
    if (cat === categoriaActiva) boton.classList.add('activo');
    boton.addEventListener('click', function(){
      categoriaActiva = cat;
      renderizarFiltros();
      renderizarProductos();
    });
    contenedorFiltros.appendChild(boton);
  });
}

// =========================================================
// 6) RENDERIZAR PRODUCTOS
// =========================================================
const contenedorProductos = document.getElementById('contenedorProductos');
const mensajeVacio = document.getElementById('mensajeVacio');
let indiceFotoActual = {}; // recuerda qué foto se está mostrando de cada producto

function obtenerFotosProducto(p){
  if (p.imagenesUrls && p.imagenesUrls.length) return p.imagenesUrls;
  return p.imagenUrl ? [p.imagenUrl] : [];
}

function renderizarProductos(){
  const lista = categoriaActiva === 'Todos'
    ? productos
    : productos.filter(function(p){ return p.categoria === categoriaActiva; });

  contenedorProductos.innerHTML = '';

  if (lista.length === 0){
    mensajeVacio.style.display = 'block';
    contenedorProductos.appendChild(mensajeVacio);
    mensajeVacio.textContent = productos.length === 0
      ? 'Aún no hay productos disponibles. Vuelve pronto.'
      : 'No hay productos en esta categoría.';
    return;
  }
  mensajeVacio.style.display = 'none';

  lista.forEach(function(p){
    const fotos = obtenerFotosProducto(p);
    const indiceActual = indiceFotoActual[p.id] || 0;
    const fotoMostrada = fotos[indiceActual] || fotos[0] || '';
    const tieneVariasFotos = fotos.length > 1;

    const tarjeta = document.createElement('div');
    tarjeta.className = 'tarjeta';
    tarjeta.setAttribute('data-tarjeta-id', p.id);
    tarjeta.innerHTML =
      '<div class="contenedor-imagen">' +
        '<img src="' + fotoMostrada + '" alt="' + escaparHtml(p.nombre) + '">' +
        (tieneVariasFotos ?
          '<button type="button" class="flecha-foto flecha-izq" data-foto-anterior="' + p.id + '">‹</button>' +
          '<button type="button" class="flecha-foto flecha-der" data-foto-siguiente="' + p.id + '">›</button>' +
          '<span class="contador-fotos">' + (indiceActual + 1) + '/' + fotos.length + '</span>'
          : '') +
      '</div>' +
      '<div class="info">' +
        '<span class="categoria">' + escaparHtml(p.categoria || '') + '</span>' +
        '<span class="nombre">' + escaparHtml(p.nombre || '') + '</span>' +
        '<span class="descripcion">' + escaparHtml(p.descripcion || '') + '</span>' +
        '<span class="precio">' + formatearPrecio(p.precio) + '</span>' +
        '<div class="controles-cantidad">' +
          '<button type="button" data-restar="' + p.id + '">−</button>' +
          '<span id="cantidad-' + p.id + '">1</span>' +
          '<button type="button" data-sumar="' + p.id + '">+</button>' +
        '</div>' +
      '</div>' +
      '<div class="acciones">' +
        '<button type="button" class="btn btn-agregar" data-agregar="' + p.id + '">Agregar al carrito</button>' +
        '<button type="button" class="btn btn-preguntar" data-preguntar="' + p.id + '">Preguntar</button>' +
      '</div>';
    contenedorProductos.appendChild(tarjeta);
  });
}

contenedorProductos.addEventListener('click', function(e){
  const idSumar = e.target.getAttribute('data-sumar');
  const idRestar = e.target.getAttribute('data-restar');
  const idAgregar = e.target.getAttribute('data-agregar');
  const idPreguntar = e.target.getAttribute('data-preguntar');
  const idFotoAnterior = e.target.getAttribute('data-foto-anterior');
  const idFotoSiguiente = e.target.getAttribute('data-foto-siguiente');

  if (idFotoAnterior || idFotoSiguiente){
    const idProducto = idFotoAnterior || idFotoSiguiente;
    const p = productos.find(function(prod){ return prod.id === idProducto; });
    if (!p) return;
    const fotos = obtenerFotosProducto(p);
    if (fotos.length < 2) return;
    let indice = indiceFotoActual[idProducto] || 0;
    indice = idFotoAnterior ? (indice - 1 + fotos.length) % fotos.length : (indice + 1) % fotos.length;
    indiceFotoActual[idProducto] = indice;
    const tarjetaEl = contenedorProductos.querySelector('[data-tarjeta-id="' + idProducto + '"]');
    if (tarjetaEl){
      const imgEl = tarjetaEl.querySelector('img');
      const contadorEl = tarjetaEl.querySelector('.contador-fotos');
      if (imgEl) imgEl.src = fotos[indice];
      if (contadorEl) contadorEl.textContent = (indice + 1) + '/' + fotos.length;
    }
    return;
  }

  if (idSumar){
    const span = document.getElementById('cantidad-' + idSumar);
    span.textContent = parseInt(span.textContent, 10) + 1;
  }
  if (idRestar){
    const span = document.getElementById('cantidad-' + idRestar);
    const actual = parseInt(span.textContent, 10);
    if (actual > 1) span.textContent = actual - 1;
  }
  if (idAgregar){
    const cantidad = parseInt(document.getElementById('cantidad-' + idAgregar).textContent, 10);
    agregarAlCarrito(idAgregar, cantidad);
  }
  if (idPreguntar){
    preguntarPorProducto(idPreguntar);
  }
});

function preguntarPorProducto(id){
  const p = productos.find(function(prod){ return prod.id === id; });
  if (!p) return;
  const mensaje = 'Hola, tengo una duda sobre este producto: ' + p.nombre + ' (' + formatearPrecio(p.precio) + ').';
  iniciarOContinuarChat(mensaje);
}

// =========================================================
// 7) CARRITO
// =========================================================
const botonCarrito = document.getElementById('botonCarrito');
const contadorCarrito = document.getElementById('contadorCarrito');
const fondoOscuro = document.getElementById('fondoOscuro');
const panelCarrito = document.getElementById('panelCarrito');
const itemsCarrito = document.getElementById('itemsCarrito');
const totalCarritoEl = document.getElementById('totalCarrito');

function agregarAlCarrito(id, cantidad){
  const p = productos.find(function(prod){ return prod.id === id; });
  if (!p) return;
  const existente = carrito.find(function(item){ return item.id === id; });
  if (existente){
    existente.cantidad += cantidad;
  } else {
    carrito.push({
      id: p.id,
      nombre: p.nombre,
      precio: p.precio,
      imagenUrl: p.imagenUrl || '',
      cantidad: cantidad
    });
  }
  guardarCarrito();
  actualizarCarritoUI();
  abrirPanelCarrito();
}

function cambiarCantidadCarrito(id, delta){
  const item = carrito.find(function(i){ return i.id === id; });
  if (!item) return;
  item.cantidad += delta;
  if (item.cantidad <= 0){
    carrito = carrito.filter(function(i){ return i.id !== id; });
  }
  guardarCarrito();
  actualizarCarritoUI();
}

function quitarDelCarrito(id){
  carrito = carrito.filter(function(i){ return i.id !== id; });
  guardarCarrito();
  actualizarCarritoUI();
}

function calcularTotal(){
  return carrito.reduce(function(acc, item){ return acc + (item.precio * item.cantidad); }, 0);
}

function actualizarCarritoUI(){
  const totalUnidades = carrito.reduce(function(acc, i){ return acc + i.cantidad; }, 0);
  contadorCarrito.textContent = totalUnidades;
  contadorCarrito.style.display = totalUnidades > 0 ? 'flex' : 'none';

  itemsCarrito.innerHTML = '';
  if (carrito.length === 0){
    itemsCarrito.innerHTML = '<p id="carritoVacioTexto">Tu carrito está vacío.</p>';
  } else {
    carrito.forEach(function(item){
      const fila = document.createElement('div');
      fila.className = 'item-carrito';
      fila.innerHTML =
        '<img src="' + item.imagenUrl + '" alt="">' +
        '<div class="detalle">' +
          '<div class="nombre">' + escaparHtml(item.nombre) + '</div>' +
          '<div class="precio">' + formatearPrecio(item.precio) + '</div>' +
          '<div class="cantidad-controles">' +
            '<button type="button" data-menos="' + item.id + '">−</button>' +
            '<span>' + item.cantidad + '</span>' +
            '<button type="button" data-mas="' + item.id + '">+</button>' +
            '<button type="button" class="quitar" data-quitar="' + item.id + '">Quitar</button>' +
          '</div>' +
        '</div>';
      itemsCarrito.appendChild(fila);
    });
  }

  totalCarritoEl.textContent = formatearPrecio(calcularTotal());
}

itemsCarrito.addEventListener('click', function(e){
  const menos = e.target.getAttribute('data-menos');
  const mas = e.target.getAttribute('data-mas');
  const quitar = e.target.getAttribute('data-quitar');
  if (menos) cambiarCantidadCarrito(menos, -1);
  if (mas) cambiarCantidadCarrito(mas, 1);
  if (quitar) quitarDelCarrito(quitar);
});

function abrirPanelCarrito(){
  fondoOscuro.style.display = 'block';
  panelCarrito.style.display = 'flex';
}
function cerrarPanelCarrito(){
  fondoOscuro.style.display = 'none';
  panelCarrito.style.display = 'none';
}

botonCarrito.addEventListener('click', abrirPanelCarrito);
fondoOscuro.addEventListener('click', cerrarPanelCarrito);
document.getElementById('btnCerrarCarrito').addEventListener('click', cerrarPanelCarrito);

document.getElementById('botonFinalizar').addEventListener('click', function(){
  if (carrito.length === 0){
    alert('Tu carrito está vacío.');
    return;
  }
  let mensaje = 'Hola, quiero hacer el siguiente pedido en ' + CONFIG_TIENDA.nombreTienda + ':\n\n';
  carrito.forEach(function(item){
    mensaje += '- ' + item.cantidad + ' x ' + item.nombre + ' — ' + formatearPrecio(item.precio * item.cantidad) + '\n';
  });
  mensaje += '\nTotal: ' + formatearPrecio(calcularTotal());
  cerrarPanelCarrito();
  iniciarOContinuarChat(mensaje);
});

// Inicializar UI del carrito con lo que haya en localStorage
actualizarCarritoUI();

// =========================================================
// 8) CHAT INTERNO CON LA TIENDA
// Reemplaza a WhatsApp: todo queda guardado en Firestore, en la
// colección "chats" (un documento por conversación) y su
// subcolección "mensajes". La identidad del cliente se guarda en
// localStorage de su navegador para que, si cierra la página y
// vuelve, siga viendo la misma conversación.
// =========================================================
const botonChat = document.getElementById('botonChat');
const fondoOscuroChat = document.getElementById('fondoOscuroChat');
const panelChat = document.getElementById('panelChat');
const formInicioChat = document.getElementById('formInicioChat');
const campoNombreChatCliente = document.getElementById('campoNombreChatCliente');
const campoTelefonoChatCliente = document.getElementById('campoTelefonoChatCliente');
const btnIniciarChat = document.getElementById('btnIniciarChat');
const conversacionChat = document.getElementById('conversacionChat');
const estadoChatCliente = document.getElementById('estadoChatCliente');
const mensajesChatCliente = document.getElementById('mensajesChatCliente');
const formEnviarMensajeChat = document.getElementById('formEnviarMensajeChat');
const campoMensajeChat = document.getElementById('campoMensajeChat');
const btnNuevaConversacion = document.getElementById('btnNuevaConversacion');

let chatCliente = cargarChatLocal();  // { id, nombre, telefono } o null
let chatEstadoActual = 'abierto';
let mensajePendienteAlAbrir = null;
let dejarDeEscucharChatCliente = null;
let dejarDeEscucharMensajesCliente = null;

function cargarChatLocal(){
  try{
    return JSON.parse(localStorage.getItem('chatTiendaCliente')) || null;
  }catch(e){
    return null;
  }
}
function guardarChatLocal(){
  if (chatCliente){
    localStorage.setItem('chatTiendaCliente', JSON.stringify(chatCliente));
  } else {
    localStorage.removeItem('chatTiendaCliente');
  }
}

function mostrarFormularioInicio(){
  formInicioChat.style.display = 'block';
  conversacionChat.style.display = 'none';
}
function mostrarConversacion(){
  formInicioChat.style.display = 'none';
  conversacionChat.style.display = 'flex';
  escucharChatCliente();
}

function abrirPanelChat(){
  fondoOscuroChat.style.display = 'block';
  panelChat.style.display = 'flex';
  if (chatCliente && chatCliente.id){
    mostrarConversacion();
  } else {
    mostrarFormularioInicio();
  }
}
function cerrarPanelChat(){
  fondoOscuroChat.style.display = 'none';
  panelChat.style.display = 'none';
}

function iniciarOContinuarChat(mensaje){
  abrirPanelChat();
  if (chatCliente && chatCliente.id){
    enviarMensajeCliente(mensaje);
  } else {
    mensajePendienteAlAbrir = mensaje;
  }
}

botonChat.addEventListener('click', function(){ abrirPanelChat(); });
fondoOscuroChat.addEventListener('click', cerrarPanelChat);
document.getElementById('btnCerrarChat').addEventListener('click', cerrarPanelChat);

btnIniciarChat.addEventListener('click', function(){
  const nombre = campoNombreChatCliente.value.trim();
  const telefono = campoTelefonoChatCliente.value.trim();
  if (!nombre || !telefono){
    alert('Escribe tu nombre y tu teléfono para iniciar el chat.');
    return;
  }
  btnIniciarChat.disabled = true;
  db.collection('chats').add({
    nombreCliente: nombre,
    telefono: telefono,
    estado: 'abierto',
    atendidoPor: null,
    creado: firebase.firestore.FieldValue.serverTimestamp(),
    actualizado: firebase.firestore.FieldValue.serverTimestamp(),
    ultimoMensajeDe: 'cliente'
  }).then(function(ref){
    chatCliente = { id: ref.id, nombre: nombre, telefono: telefono };
    guardarChatLocal();
    mostrarConversacion();
    if (mensajePendienteAlAbrir){
      enviarMensajeCliente(mensajePendienteAlAbrir);
      mensajePendienteAlAbrir = null;
    }
  }).catch(function(error){
    console.error(error);
    alert('Ocurrió un error al iniciar el chat. Intenta de nuevo.');
  }).finally(function(){
    btnIniciarChat.disabled = false;
  });
});

function escucharChatCliente(){
  if (!chatCliente || !chatCliente.id) return;

  if (dejarDeEscucharChatCliente) dejarDeEscucharChatCliente();
  dejarDeEscucharChatCliente = db.collection('chats').doc(chatCliente.id).onSnapshot(function(doc){
    if (!doc.exists) return;
    const c = doc.data();
    chatEstadoActual = c.estado || 'abierto';
    if (chatEstadoActual === 'abierto'){
      estadoChatCliente.textContent = 'Esperando que alguien te atienda...';
    } else if (chatEstadoActual === 'atendido'){
      estadoChatCliente.textContent = 'Te está atendiendo ' + (c.atendidoPor || 'un asesor') + '.';
    } else {
      estadoChatCliente.textContent = 'Esta conversación fue cerrada. Puedes escribir de nuevo para reabrirla.';
    }
  });

  if (dejarDeEscucharMensajesCliente) dejarDeEscucharMensajesCliente();
  dejarDeEscucharMensajesCliente = db.collection('chats').doc(chatCliente.id).collection('mensajes')
    .orderBy('fecha', 'asc')
    .onSnapshot(function(snapshot){
      mensajesChatCliente.innerHTML = '';
      snapshot.forEach(function(doc){
        const m = doc.data();
        const burbuja = document.createElement('div');
        burbuja.className = 'burbuja ' + (m.autor === 'admin' ? 'admin' : 'cliente');
        burbuja.innerHTML = (m.autor === 'admin' ? '<span class="autor">' + escaparHtml(m.nombreAutor || 'Atención') + '</span>' : '') + escaparHtml(m.texto || '');
        mensajesChatCliente.appendChild(burbuja);
      });
      mensajesChatCliente.scrollTop = mensajesChatCliente.scrollHeight;
    }, function(error){
      console.error('Error leyendo mensajes del chat:', error);
    });
}

function enviarMensajeCliente(texto){
  if (!chatCliente || !chatCliente.id || !texto) return Promise.resolve();
  return db.collection('chats').doc(chatCliente.id).collection('mensajes').add({
    autor: 'cliente',
    texto: texto,
    nombreAutor: chatCliente.nombre,
    fecha: firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){
    const actualizacion = {
      actualizado: firebase.firestore.FieldValue.serverTimestamp(),
      ultimoMensajeDe: 'cliente'
    };
    if (chatEstadoActual === 'cerrado'){
      actualizacion.estado = 'abierto';
      actualizacion.atendidoPor = null;
    }
    return db.collection('chats').doc(chatCliente.id).update(actualizacion);
  });
}

formEnviarMensajeChat.addEventListener('submit', function(e){
  e.preventDefault();
  const texto = campoMensajeChat.value.trim();
  if (!texto) return;
  campoMensajeChat.disabled = true;
  enviarMensajeCliente(texto).then(function(){
    campoMensajeChat.value = '';
  }).catch(function(error){
    console.error(error);
    alert('No se pudo enviar tu mensaje. Intenta de nuevo.');
  }).finally(function(){
    campoMensajeChat.disabled = false;
    campoMensajeChat.focus();
  });
});

btnNuevaConversacion.addEventListener('click', function(){
  if (!confirm('¿Iniciar una conversación nueva? Ya no vas a ver el historial de esta desde este dispositivo.')) return;
  if (dejarDeEscucharChatCliente){ dejarDeEscucharChatCliente(); dejarDeEscucharChatCliente = null; }
  if (dejarDeEscucharMensajesCliente){ dejarDeEscucharMensajesCliente(); dejarDeEscucharMensajesCliente = null; }
  chatCliente = null;
  guardarChatLocal();
  mostrarFormularioInicio();
});
</script>
